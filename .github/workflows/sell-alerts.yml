name: Verkoopmeldingen

# Elk half uur: Beursradar bekijkt de posities van iedereen met meldingen aan
# en stuurt een pushmelding als iets verkocht moet worden.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: curl -fsS --max-time 120 https://beursradar.vercel.app/api/cron/sell-alerts
