name: Achtergrondtaken

# De trading bot en de verkoopmeldingen draaien hier continu.
# GitHub start geplande taken voor kleine projecten onregelmatig (soms maar één keer per uur),
# daarom blijft elke run bijna 6 uur bezig (het maximum per job) en doet hij:
#  - elke minuut een ronde van de trading bot;
#  - elke 10 minuten de verkoopmeldingen.
# Het schema hieronder zorgt dat er na een run snel weer een nieuwe start; er draait er nooit meer dan één.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: achtergrondtaken
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Bot elke minuut, meldingen elke 10 minuten
        run: |
          end=$((SECONDS + 5 * 3600 + 45 * 60))
          i=0
          while [ $SECONDS -lt $end ]; do
            if [ $((i % 10)) -eq 0 ]; then
              curl -sS --max-time 120 https://beursradar.vercel.app/api/cron/sell-alerts || true
              echo
            fi
            curl -sS --max-time 55 https://beursradar.vercel.app/api/cron/bot || true
            echo
            i=$((i + 1))
            sleep 55
          done
