<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#05070c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.6">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="0.55" stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="0.6" stop-color="#34d399"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.14"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- BACKGROUND -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- ART -->
  <g transform="translate(256 300)">
    <!-- radarringen -->
    <circle r="190" fill="none" stroke="#10b981" stroke-opacity="0.16" stroke-width="5"/>
    <circle r="130" fill="none" stroke="#10b981" stroke-opacity="0.22" stroke-width="5"/>
    <circle r="70" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="5"/>
    <line x1="-200" y1="0" x2="200" y2="0" stroke="#10b981" stroke-opacity="0.14" stroke-width="4"/>
    <line x1="0" y1="-200" x2="0" y2="200" stroke="#10b981" stroke-opacity="0.14" stroke-width="4"/>
    <!-- radarstraal -->
    <path d="M0 0 L0 -190 A190 190 0 0 1 164.5 -95 Z" fill="url(#sweep)"/>
  </g>
  <!-- stijgende koerslijn -->
  <path d="M86 352 L170 300 L222 330 L300 228 L352 258 L424 150" fill="none" stroke="#10b981" stroke-opacity="0.35" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M86 352 L170 300 L222 330 L300 228 L352 258 L424 150" fill="none" stroke="url(#line)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- stip op de top -->
  <circle cx="424" cy="150" r="34" fill="#60a5fa" fill-opacity="0.3"/>
  <circle cx="424" cy="150" r="20" fill="#e0f2fe"/>
  <!-- glans -->
  <rect width="512" height="512" rx="112" fill="url(#shine)"/>
</svg>
